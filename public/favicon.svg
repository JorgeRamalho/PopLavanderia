    <filter id="pop-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#2de6d0" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="34" height="34" rx="12" fill="url(#pop-brand)" filter="url(#pop-glow)"/>
  <circle cx="10.2" cy="11.9" r="2.72" fill="#ffffff"/>
  <circle cx="21.08" cy="9.52" r="3.06" fill="#ff4f98" fill-opacity="0.9"/>
