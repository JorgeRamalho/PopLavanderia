<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 34" role="img" aria-label="PopLavanderia">
  <defs>
    <linearGradient id="pop-brand" x1="0" y1="0" x2="34" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2de6d0"/>
      <stop offset="0.46" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#ff4f98"/>
