<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2034%2034%22%20role%3D%22img%22%20aria-label%3D%22PopLavanderia%22%3E%20%3Cdefs%3E%20%3ClinearGradient%20id%3D%22pop-brand%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%2234%22%20y2%3D%2234%22%20gradientUnits%3D%22userSpaceOnUse%22%3E%20%3Cstop%20offset%3D%220%22%20stop-color%3D%22%232de6d0%22%2F%3E%20%3Cstop%20offset%3D%220.46%22%20stop-color%3D%22%234f8cff%22%2F%3E%20%3Cstop%20offset%3D%221%22%20stop-color%3D%22%23ff4f98%22%2F%3E%20%3C%2FlinearGradient%3E%20%3Cfilter%20id%3D%22pop-glow%22%20x%3D%22-20%25%22%20y%3D%22-20%25%22%20width%3D%22140%25%22%20height%3D%22140%25%22%3E%20%3CfeDropShadow%20dx%3D%220%22%20dy%3D%220%22%20stdDeviation%3D%221.2%22%20flood-color%3D%22%232de6d0%22%20flood-opacity%3D%220.35%22%2F%3E%20%3C%2Ffilter%3E%20%3C%2Fdefs%3E%20%3Crect%20width%3D%2234%22%20height%3D%2234%22%20rx%3D%2212%22%20fill%3D%22url(%23pop-brand)%22%20filter%3D%22url(%23pop-glow)%22%2F%3E%20%3Ccircle%20cx%3D%2210.2%22%20cy%3D%2211.9%22%20r%3D%222.72%22%20fill%3D%22%23ffffff%22%2F%3E%20%3Ccircle%20cx%3D%2221.08%22%20cy%3D%229.52%22%20r%3D%223.06%22%20fill%3D%22%23ff4f98%22%20fill-opacity%3D%220.9%22%2F%3E%20%3C%2Fsvg%3E" type="image/svg+xml" />
    <script defer src="header-scroll.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta | PopLavanderia</title>
    <meta name="description" content="Cadastre-se na PopLavanderia com dados completos, receba créditos de boas-vindas e comece a usar lavadoras e secadoras em Curitiba." />
    <link rel="canonical" href="https://poplavanderia.com.br/cadastro.html" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span>Pop<span>Lavanderia</span></span></a>
        <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="Principal">
          <a href="/">Início</a><a href="/unidades.html">Unidades</a><a href="/servicos.html">Serviços</a><a href="/sobre.html">Sobre</a><a href="/app.html">App</a>
        </nav>
        <div class="auth-slot"><a class="btn btn-ghost" href="/login.html">Entrar</a><a class="btn btn-primary" href="/cadastro.html">Criar conta</a></div>
      </div>
    </header>
    <main id="conteudo">
      <form id="form-cadastro" class="form-card card" novalidate>
        <p class="eyebrow">Cadastro completo</p>
        <h1>Vamos te conhecer para cuidar da sua lavagem.</h1>
        <p class="muted" data-step-label>Etapa 1 de 3</p>
        <div class="progress" data-progress aria-hidden="true"><span></span><span></span><span></span></div>

        <div data-step="1">
          <div class="form-grid">
            <label>Nome completo
              <input name="nomeCompleto" autocomplete="name" required />
              <span class="field-error" data-error="nomeCompleto"></span>
            </label>
            <label>CPF
              <input name="cpf" inputmode="numeric" autocomplete="off" required />
              <span class="field-error" data-error="cpf"></span>
            </label>
            <label>E-mail
              <input name="email" type="email" autocomplete="email" required />
              <span class="field-error" data-error="email"></span>
            </label>
            <label>Celular / WhatsApp
              <input name="telefone" type="tel" inputmode="tel" autocomplete="tel" required />
              <span class="field-error" data-error="telefone"></span>
            </label>
            <label>Data de nascimento
              <input name="dataNascimento" type="date" required />
              <span class="field-error" data-error="dataNascimento"></span>
            </label>
          </div>
          <button class="btn btn-primary" type="button" data-next>Continuar para o endereço</button>
        </div>

        <div data-step="2" hidden>
          <div class="form-grid">
            <label>CEP
              <input name="cep" inputmode="numeric" autocomplete="postal-code" required />
              <span class="field-error" data-error="cep"></span>
            </label>
            <label>Número
              <input name="numero" required />
              <span class="field-error" data-error="numero"></span>
            </label>
            <label>Logradouro
              <input name="logradouro" required />
              <span class="field-error" data-error="logradouro"></span>
            </label>
            <label>Complemento
              <input name="complemento" />
            </label>
            <label>Bairro
              <input name="bairro" required />
              <span class="field-error" data-error="bairro"></span>
            </label>
            <label>Cidade
              <input name="cidade" value="Curitiba" required />
              <span class="field-error" data-error="cidade"></span>
            </label>
            <label>Estado
              <input name="estado" value="PR" maxlength="2" required />
              <span class="field-error" data-error="estado"></span>
            </label>
          </div>
          <div class="card-actions">
            <button class="btn btn-ghost" type="button" data-prev>Voltar</button>
            <button class="btn btn-primary" type="button" data-next>Criar acesso</button>
          </div>
        </div>

        <div data-step="3" hidden>
          <div class="form-grid">
            <label>Senha
              <input name="senha" type="password" autocomplete="new-password" required />
              <span class="password-meter" data-password-meter></span>
              <span class="field-error" data-error="senha"></span>
            </label>
            <label>Confirmar senha
              <input name="confirmarSenha" type="password" autocomplete="new-password" required />
              <span class="field-error" data-error="confirmarSenha"></span>
            </label>
          </div>
          <label class="check"><input name="aceitaTermos" type="checkbox" /> Aceito os termos de uso e a política de privacidade.</label>
          <span class="field-error" data-error="aceitaTermos"></span>
          <label class="check"><input name="aceitaNovidades" type="checkbox" /> Quero novidades e ofertas das unidades.</label>
          <div class="card-actions">
            <button class="btn btn-ghost" type="button" data-prev>Voltar</button>
            <button class="btn btn-primary" type="submit">Criar conta e ganhar 20 créditos</button>
          </div>
        </div>
        <p class="muted">Já tem conta? <a href="/login.html">Entrar</a></p>
      </form>
    </main>
    <script type="module" src="/src/js/pages/cadastro.js"></script>
  </body>
</html>
