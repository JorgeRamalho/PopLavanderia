    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redefinir senha | PopLavanderia</title>
    <meta name="description" content="Crie uma nova senha para acessar créditos e máquinas da PopLavanderia." />
    <link rel="stylesheet" href="/src/css/main.css" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <main id="conteudo">
      <p class="form-card card" data-invalid-token hidden>
        Este link expirou ou é inválido. <a href="/recuperar-senha.html">Pedir um novo acesso</a>.
      </p>
      <form id="form-redefinir" class="form-card card">
        <p class="eyebrow">Nova senha</p>
        <h1>Escolha uma senha fácil de lembrar e difícil de adivinhar.</h1>
        <label>Nova senha
          <input name="senha" type="password" autocomplete="new-password" required />
        </label>
        <label>Confirmar senha
          <input name="confirmarSenha" type="password" autocomplete="new-password" required />
        </label>
        <p class="field-error" data-reset-error></p>
        <button class="btn btn-primary" type="submit">Salvar senha</button>
      </form>
    </main>
    <script type="module" src="/src/js/pages/redefinir.js"></script>
  </body>
</html>
