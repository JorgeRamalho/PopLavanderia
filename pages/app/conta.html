    <script defer src="/header-scroll.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minha conta | PopLavanderia</title>
    <meta name="description" content="Atualize seus dados cadastrais da PopLavanderia." />
    <link rel="stylesheet" href="/src/css/main.css" />
    <meta name="robots" content="noindex" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span>Pop<span>Lavanderia</span></span></a>
        <nav class="site-nav" aria-label="Principal">
          <a href="/app.html">App</a><a href="/conta.html">Conta</a>
        </nav>
        <div class="auth-slot"></div>
      </div>
    </header>
    <main id="conteudo">
      <form id="form-conta" class="form-card card">
        <p class="eyebrow">Perfil</p>
        <h1>Seus dados, sempre à mão.</h1>
        <div class="form-grid">
          <label>Nome completo<input name="nomeCompleto" required /></label>
          <label>Nome social<input name="nomeSocial" /></label>
          <label>CPF<input name="cpf" disabled /></label>
          <label>E-mail<input name="email" type="email" disabled /></label>
          <label>Celular<input name="telefone" /></label>
          <label>Telefone alternativo<input name="telefoneSecundario" /></label>
          <label>Nascimento<input name="dataNascimento" type="date" disabled /></label>
          <label>Unidade preferida<input name="unidadePreferida" disabled /></label>
          <label>CEP<input name="cep" /></label>
          <label>Logradouro<input name="logradouro" /></label>
          <label>Número<input name="numero" /></label>
          <label>Complemento<input name="complemento" /></label>
          <label>Bairro<input name="bairro" /></label>
          <label>Cidade<input name="cidade" /></label>
          <label>Estado<input name="estado" maxlength="2" /></label>
          <label class="span-2">Referência<input name="referencia" /></label>
        </div>
        <label class="check"><input name="aceitaNovidades" type="checkbox" /> Quero novidades por e-mail</label>
        <button class="btn btn-primary" type="submit">Salvar alterações</button>
      </form>
    </main>
    <script type="module" src="/src/js/pages/conta.js"></script>
  </body>
</html>
