    <script defer src="/header-scroll.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar | PopLavanderia</title>
    <meta name="description" content="Acesse sua conta PopLavanderia para ver créditos, iniciar lavadoras e secadoras e acompanhar o tempo de cada ciclo." />
    <link rel="canonical" href="https://poplavanderia.com.br/login.html" />
    <link rel="stylesheet" href="/src/css/main.css" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span>Pop<span>Lavanderia</span></span></a>
        <button class="nav-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
        <nav class="site-nav" aria-label="Principal">
          <a href="/">Início</a><a href="/unidades.html">Unidades</a><a href="/servicos.html">Serviços</a><a href="/sobre.html">Sobre</a><a href="/app.html">App</a>
        </nav>
        <div class="auth-slot"><a class="btn btn-ghost" href="/login.html">Entrar</a><a class="btn btn-primary" href="/#cadastro">Criar conta</a></div>
      </div>
    </header>
    <main id="conteudo">
      <form id="form-login" class="form-card card" novalidate>
        <p class="eyebrow">Área do cliente</p>
        <h1>Que bom te ver de novo.</h1>
        <p class="muted">Entre para escolher a máquina, recarregar créditos e acompanhar o ciclo.</p>
        <label>E-mail
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>Senha
          <input name="senha" type="password" autocomplete="current-password" required />
        </label>
        <label class="check"><input name="lembrar" type="checkbox" /> Lembrar de mim neste aparelho</label>
        <p class="field-error" data-login-error></p>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <div class="card-actions" style="margin-top:1rem">
          <a href="/recuperar-senha.html">Esqueci a senha</a>
          <a href="/#cadastro">Criar conta</a>
        </div>
        <button class="btn btn-ghost" type="button" data-demo style="margin-top:1rem">Usar conta demonstração</button>
        <p class="muted">Demonstração: ana@poplavanderia.com · Pop@1234</p>
      </form>
    </main>
    <script type="module" src="/src/js/pages/login.js"></script>
  </body>
</html>
