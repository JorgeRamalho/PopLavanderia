    <main id="conteudo">
      <form id="form-recuperar" class="form-card card">
        <p class="eyebrow">Recuperar acesso</p>

        <p class="muted">Informe o e-mail da conta. Você recebe um link para criar uma senha nova.</p>
        <label>E-mail
          <input name="email" type="email" required />
        </label>
        <p class="field-error" data-reset-error></p>
        <button class="btn btn-primary" type="submit">Enviar link</button>
        <div data-reset-result hidden style="margin-top:1.2rem"></div>
      </form>
    </main>
